spring.application.name=order-service
server.port=7074
spring.datasource.url=jdbc:postgresql://localhost:5432/broker_orders
spring.datasource.username=postgres
spring.datasource.password=mypassword
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.show-sql=true
logging.level.org.hibernate=INFO
logging.level.org.springframework.jdbc=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

market.service.url=http://localhost:7073
savings.service.url=http://localhost:7072
order.processing.interval-ms=${ORDER_PROCESSING_INTERVAL_MS:10000}
market.quote.max-age-seconds=${MARKET_QUOTE_MAX_AGE_SECONDS:2700}
