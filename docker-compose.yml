networks:
  broker-network:
    driver: bridge

services:
  postgres_auth:
    image: postgres:17
    container_name: postgres_auth
    environment:
      POSTGRES_DB: broker_auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypassword
    volumes:
      - "./db-dumps/broker_auth.sql:/docker-entrypoint-initdb.d/broker_auth.sql"
      - pg_auth_data:/var/lib/postgresql/data
    ports:
      - "15432:5432"
    networks:
      - broker-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_market:
    image: postgres:17
    container_name: postgres_market
    environment:
      POSTGRES_DB: broker_market
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypassword
    volumes:
      - pg_market_data:/var/lib/postgresql/data
    ports:
      - "15433:5432"
    networks:
      - broker-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_orders:
    image: postgres:17
    container_name: postgres_orders
    environment:
      POSTGRES_DB: broker_orders
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypassword
    volumes:
      - pg_orders_data:/var/lib/postgresql/data
    ports:
      - "15434:5432"
    networks:
      - broker-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_savings:
    image: postgres:17
    container_name: postgres_savings
    environment:
      POSTGRES_DB: broker_savings
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypassword
    volumes:
      - "./db-dumps/broker_savings.sql:/docker-entrypoint-initdb.d/broker_savings.sql"
      - pg_savings_data:/var/lib/postgresql/data
    ports:
      - "15435:5432"
    networks:
      - broker-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./auth-service
    container_name: auth-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_auth:5432/broker_auth
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: mypassword
      SERVER_PORT: 7071
    ports:
      - "7071:7071"
    depends_on:
      postgres_auth:
        condition: service_healthy
    networks:
      - broker-network
    restart: on-failure

  gateway-service:
    build:
      context: ./gateway-service
    container_name: gateway-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_auth:5432/broker_auth
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: mypassword
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_SECRET_KEY: ZzYJ/6d54kjZQM2z0a02xMfHyZAeDq+krlmL8DAnR5KiyeLQfEvj19ZgkLmXX7WcZd3L5XsCNN04B+X0jhhKbg==
      SERVER_PORT: 7070
      AUTH_SERVICE_URL: http://auth-service:7071
      SAVINGS_SERVICE_URL: http://savings-service:7072
      MARKET_SERVICE_URL: http://market-service:7073
      ORDER_SERVICE_URL: http://order-service:7074
    ports:
      - "7070:7070"
    depends_on:
      postgres_auth:
        condition: service_healthy
    networks:
      - broker-network
    restart: on-failure

  market-service:
    build:
      context: ./market-service
    container_name: market-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_market:5432/broker_market
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: mypassword
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-ALOR}
      ALOR_BASE_URL: ${ALOR_BASE_URL:-https://api.alor.ru}
      MARKET_DATA_REFRESH_INTERVAL_MS: ${MARKET_DATA_REFRESH_INTERVAL_MS:-60000}
      SERVER_PORT: 7073
    ports:
      - "7073:7073"
    depends_on:
      postgres_market:
        condition: service_healthy
    networks:
      - broker-network
    restart: on-failure

  savings-service:
    build:
      context: ./savings-service
    container_name: savings-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_savings:5432/broker_savings
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: mypassword
      SERVER_PORT: 7072
    ports:
      - "7072:7072"
    depends_on:
      postgres_savings:
        condition: service_healthy
    networks:
      - broker-network
    restart: on-failure

  order-service:
    build:
      context: ./order-service  
    container_name: order-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_orders:5432/broker_orders
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: mypassword
      SERVER_PORT: 7074
      MARKET_SERVICE_URL: http://market-service:7073
      SAVINGS_SERVICE_URL: http://savings-service:7072
      ORDER_PROCESSING_INTERVAL_MS: ${ORDER_PROCESSING_INTERVAL_MS:-10000}
      MARKET_QUOTE_MAX_AGE_SECONDS: ${MARKET_QUOTE_MAX_AGE_SECONDS:-2700}
    ports:
      - "7074:7074"
    depends_on:
      postgres_orders:
        condition: service_healthy
    networks:
      - broker-network
    restart: on-failure

volumes:
  pg_auth_data:
  pg_market_data:
  pg_orders_data:
  pg_savings_data:
