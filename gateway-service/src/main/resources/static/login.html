<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#153d32">
    <title>Вход · Demo Broker</title>
    <link rel="stylesheet" href="/app.css">
</head>
<body class="auth-page">
<main class="auth-layout">
    <aside class="auth-intro">
        <a class="auth-brand" href="/index.html"><span class="brand-mark">D</span><span>Demo Broker</span></a>
        <div class="auth-copy">
            <p class="auth-kicker">Демо-брокер</p>
            <h1>Ваш рынок.<br>Ваш темп.</h1>
            <p>Войдите, чтобы вернуться к котировкам, счетам и портфелю.</p>
        </div>
        <p class="auth-footnote">Инвестиционный кабинет · Demo Broker</p>
    </aside>
    <section class="auth-card">
        <h2>С возвращением</h2>
        <p class="auth-description">Введите данные своего аккаунта.</p>
        <form id="loginForm" class="auth-form">
            <div class="form-group">
                <label for="login">Логин</label>
                <input type="text" id="login" name="login" placeholder="Ваш логин" autocomplete="username" minlength="3" maxlength="50" required>
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" placeholder="Введите пароль" autocomplete="current-password" required>
            </div>
            <p id="formFeedback" class="form-feedback" role="alert" aria-live="polite"></p>
            <button id="submitButton" type="submit">Войти в кабинет</button>
            <p class="auth-switch">Пока нет аккаунта? <a href="/registration.html">Зарегистрироваться</a></p>
        </form>
    </section>
</main>
<script>
    const loginForm = document.getElementById('loginForm');
    const formFeedback = document.getElementById('formFeedback');
    const submitButton = document.getElementById('submitButton');

    loginForm.addEventListener('submit', async event => {
        event.preventDefault();
        formFeedback.textContent = '';
        const data = Object.fromEntries(new FormData(loginForm).entries());
        data.login = data.login.trim();
        submitButton.disabled = true;
        submitButton.textContent = 'Входим…';

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data),
                credentials: 'include'
            });

            if (!response.ok) {
                let message = 'Проверьте логин и пароль и попробуйте еще раз.';
                try {
                    const error = await response.json();
                    message = error.message || error.error || message;
                } catch (_) {}
                throw new Error(message);
            }

            const responseText = await response.text();
            let result = {};
            try { result = JSON.parse(responseText); } catch (_) {}
            const token = result.token || result.accessToken || result.access_token || result.jwt;
            if (token && typeof token === 'string' && token.includes('.')) localStorage.setItem('jwt_token', token);
            window.location.href = '/portfolio.html';
        } catch (error) {
            formFeedback.textContent = error.message || 'Не удалось войти. Проверьте подключение и повторите попытку.';
        } finally {
            submitButton.disabled = false;
            submitButton.textContent = 'Войти в кабинет';
        }
    });
</script>
</body>
</html>
