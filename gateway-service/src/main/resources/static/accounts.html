<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои счета</title>

    <link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="container">
    <nav class="navbar"><a href="/portfolio.html" class="brand" aria-label="Demo Broker — портфель"><span class="brand-mark">D</span><span class="brand-name">Demo Broker</span></a>
        <a href="/portfolio.html">Портфель</a>
        <a href="/markets.html">Рынки</a>
        <a href="/accounts.html" class="active">Мои счета</a>
        <a href="/orders.html">Мои заявки</a>
        <a href="/transactions.html">Мои транзакции</a>
    </nav>
    <div class="content">
        <h1>Мои валютные счета</h1>
        <div class="actions">
            <button class="deposit" onclick="openModal('deposit')">Пополнить баланс</button>
            <button class="withdraw" onclick="openModal('withdraw')">Снять баланс</button>
            <a href="/balance_history.html" class="history">История баланса</a>
        </div>
        <table id="accountsTable">
            <thead>
            <tr>
                <th>Код валюты</th>
                <th>Баланс</th>
                <th>Зарезервировано</th>
            </tr>
            </thead>
            <tbody>
            <tr><td colspan="3" class="no-data">загрузка...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<div id="modal" class="modal-backdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <h2 id="modalTitle">Операция</h2>
        <div class="form-group">
            <label for="currencyInput">Код валюты</label>
            <select id="currencyInput" required>
                <option value="" disabled selected>Выберите валюту</option>
                <option value="USD">USD — доллар США</option>
                <option value="EUR">EUR — евро</option>
                <option value="GBP">GBP — фунт стерлингов</option>
                <option value="JPY">JPY — японская иена</option>
                <option value="CHF">CHF — швейцарский франк</option>
                <option value="RUB">RUB — российский рубль</option>
            </select>
        </div>
        <div class="form-group">
            <label for="amountInput">Сумма</label>
            <input type="number" id="amountInput" min="0.01" step="0.01" placeholder="0,00" required>
        </div>
        <p id="operationFeedback" class="form-feedback" role="status" aria-live="polite"></p>
        <div class="actions">
            <button class="cancel" onclick="closeModal()">Отмена</button>
            <button id="confirmOperation" class="confirm" type="button" onclick="submitOperation()">Подтвердить</button>
        </div>
    </div>
</div>

<script>
const token = localStorage.getItem('jwt_token');

if (!token) {
    document.querySelector('#accountsTable tbody').innerHTML = `
        <tr>
            <td colspan="3" class="auth-error">
                Необходимо войти в систему<br>
                <a href="/login.html">Перейти на страницу входа</a>
            </td>
        </tr>`;
}

let currentOp = null;

async function loadAccounts() {
    if (!token) return;

    const tbody = document.querySelector('#accountsTable tbody');
    tbody.innerHTML = '<tr><td colspan="3" class="no-data">загрузка...</td></tr>';

    try {
        const response = await fetch('/api/accounts/list', {
            method: 'GET',
            headers: {
                'Accept': 'application/json',
                'Authorization': `Bearer ${token}`
            }
        });

        if (response.status === 401) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="3" class="auth-error">
                        Сессия истекла или токен недействителен (401)<br>
                        <a href="/login.html">Войти заново</a> |
                        <a href="#" onclick="localStorage.removeItem('jwt_token'); location.reload();">Очистить токен и обновить страницу</a>
                    </td>
                </tr>`;
            return;
        }

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        const list = await response.json();
        tbody.innerHTML = '';

        if (!list || list.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" class="no-data">Счета не найдены</td></tr>';
            return;
        }

        list.forEach(acc => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${acc.currencyCode}</td>
                <td>${Number(acc.balance).toFixed(2)}</td>
                <td>${Number(acc.reservedAmount).toFixed(2)}</td>
            `;
            tbody.appendChild(tr);
        });
    } catch (err) {
        tbody.innerHTML = '<tr><td colspan="3" class="no-data">Ошибка загрузки счетов</td></tr>';
    }
}

function openModal(op) {
    if (!token) {
        alert('Необходимо войти в систему');
        return;
    }
    currentOp = op;
    document.getElementById('modalTitle').textContent =
        op === 'deposit' ? 'Пополнить баланс' : 'Снять баланс';
    document.getElementById('currencyInput').value = '';
    document.getElementById('amountInput').value = '';
    document.getElementById('operationFeedback').textContent = '';
    document.getElementById('modal').style.display = 'flex';
}

function closeModal() {
    document.getElementById('modal').style.display = 'none';
}

async function submitOperation() {
    const currencyInput = document.getElementById('currencyInput');
    const amountInput = document.getElementById('amountInput');
    const feedback = document.getElementById('operationFeedback');
    const confirmButton = document.getElementById('confirmOperation');

    if (!token) {
        feedback.textContent = 'Сессия истекла. Войдите заново.';
        return;
    }

    if (!currencyInput.reportValidity() || !amountInput.reportValidity()) return;

    const currency = currencyInput.value;
    const amount = Number(amountInput.value);

    feedback.textContent = '';

    const url = currentOp === 'deposit' ? '/api/accounts/deposit' : '/api/accounts/withdraw';
    confirmButton.disabled = true;
    confirmButton.textContent = 'Обрабатываем…';

    try {
        const response = await fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ currencyCode: currency, amount })
        });

        if (response.status === 401) {
            feedback.textContent = 'Сессия истекла или токен недействителен. Войдите заново.';
            return;
        }

        if (response.ok) {
            closeModal();
            loadAccounts();
            return;
        }

        let errorData;
        try {
            errorData = await response.json();
        } catch {
            errorData = { message: await response.text() || 'Нет описания' };
        }
        feedback.textContent = errorData.message || errorData.error || `Не удалось выполнить операцию (${response.status}).`;
    } catch (err) {
        feedback.textContent = 'Сетевая ошибка. Проверьте подключение и повторите попытку.';
    } finally {
        confirmButton.disabled = false;
        confirmButton.textContent = 'Подтвердить';
    }
}
window.addEventListener('DOMContentLoaded', () => {
    if (token) {
        loadAccounts();
    }
});
</script>
</body>
</html>
