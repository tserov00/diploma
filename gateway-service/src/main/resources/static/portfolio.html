<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Портфель · Demo Broker</title>

    <link rel="stylesheet" href="/app.css">
</head>
<body><nav><a href="/portfolio.html" class="brand" aria-label="Demo Broker — портфель"><span class="brand-mark">D</span><span class="brand-name">Demo Broker</span></a><a href="/portfolio.html" class="active">Портфель</a><a href="/markets.html">Рынок</a><a href="/accounts.html">Счета</a><a href="/orders.html">Заявки</a><a href="/transactions.html">Исполнения</a></nav>
<main><h1>Портфель</h1><p class="muted">Свободное количество = всего минус резерв по открытым заявкам.</p><section class="portfolio-summary" aria-live="polite"><div><p class="portfolio-summary-label">Общий результат по портфелю</p><strong id="totalProfit" class="portfolio-summary-value profit-value profit-neutral">Загрузка…</strong></div><p class="portfolio-summary-note">Сумма оценки результата по всем инструментам</p></section><div class="card"><table><thead><tr><th>Инструмент</th><th>Всего</th><th>Зарезервировано</th><th>Средняя цена покупки</th><th>Последняя цена</th><th>Оценка результата</th><th></th></tr></thead><tbody id="rows"><tr><td colspan="7" class="empty">Загрузка…</td></tr></tbody></table></div></main>
<script>
    const token = localStorage.getItem('jwt_token'); const rows = document.getElementById('rows');
    const totalProfit = document.getElementById('totalProfit');
    const price = value => value == null ? '—' : Number(value).toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 4 });
    const profitClass = value => value > 0 ? 'profit-positive' : value < 0 ? 'profit-negative' : 'profit-neutral';
    function setTotalProfit(value) {
        if (value == null || !Number.isFinite(value)) { totalProfit.textContent = '—'; totalProfit.className = 'portfolio-summary-value profit-value profit-neutral'; return; }
        totalProfit.textContent = (value > 0 ? '+' : '') + price(value);
        totalProfit.className = 'portfolio-summary-value profit-value ' + profitClass(value);
    }
    function profitCell(value) {
        const td = document.createElement('td'); const amount = Number(value);
        if (value == null || !Number.isFinite(amount)) { td.textContent = '—'; td.className = 'profit-neutral'; return td; }
        td.textContent = (amount > 0 ? '+' : '') + price(amount); td.className = profitClass(amount); return td;
    }
    function instrumentCell(ticker, companyName) {
        const td = document.createElement('td'); const content = document.createElement('div'); content.className = 'instrument-cell';
        const symbol = document.createElement('span'); symbol.className = 'ticker'; symbol.textContent = ticker || '—'; content.appendChild(symbol);
        if (companyName) { const name = document.createElement('span'); name.className = 'instrument-company'; name.textContent = companyName; content.appendChild(name); }
        td.appendChild(content); return td;
    }
    async function load() {
        if (!token) { setTotalProfit(null); rows.innerHTML = '<tr><td colspan="7" class="empty">Войдите в приложение, чтобы увидеть портфель.</td></tr>'; return; }
        try {
            const response = await fetch('/api/portfolio/list', { headers: { Authorization: 'Bearer ' + token } });
            if (!response.ok) throw new Error('HTTP ' + response.status);
            const list = await response.json(); rows.replaceChildren();
            if (!list.length) { setTotalProfit(0); rows.innerHTML = '<tr><td colspan="7" class="empty">Портфель пуст. Откройте инструмент и создайте покупку.</td></tr>'; return; }
            const hasMissingProfit = list.some(position => position.unrealizedProfit == null || !Number.isFinite(Number(position.unrealizedProfit)));
            setTotalProfit(hasMissingProfit ? null : list.reduce((sum, position) => sum + Number(position.unrealizedProfit), 0));
            list.forEach(position => {
                const tr = document.createElement('tr');
                tr.appendChild(instrumentCell(position.ticker, position.companyName));
                [position.totalQuantity, position.reservedQuantity || 0, price(position.avgBuyPrice), price(position.currentPrice)]
                    .forEach(value => { const td = document.createElement('td'); td.textContent = value == null ? '—' : value; tr.appendChild(td); });
                tr.appendChild(profitCell(position.unrealizedProfit));
                const action = document.createElement('td'); const link = document.createElement('a'); link.className = 'action'; link.href = '/security.html?id=' + encodeURIComponent(position.securityId) + '&side=SELL'; link.textContent = 'Создать продажу';
                action.appendChild(link); tr.appendChild(action); rows.appendChild(tr);
            });
        } catch (error) { setTotalProfit(null); rows.innerHTML = '<tr><td colspan="7" class="empty">Не удалось загрузить портфель: ' + error.message + '</td></tr>'; }
    }
    load(); setInterval(load, 30000);
</script></body></html>
