<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Портфель · Demo Broker</title>
    <style>
        :root { font-family: system-ui, Arial, sans-serif; background: #f3f5f8; color: #172033; } body { margin: 0; }
        nav { display: flex; gap: 22px; padding: 16px max(20px, calc((100% - 1120px) / 2)); background: #fff; border-bottom: 1px solid #e1e5eb; }
        nav a { color: #526176; text-decoration: none; } nav a.active { color: #175cd3; font-weight: 700; }
        main { max-width: 1120px; margin: 32px auto; padding: 0 18px; } .card { background: white; border: 1px solid #e1e5eb; border-radius: 12px; overflow: auto; }
        table { width: 100%; min-width: 720px; border-collapse: collapse; } th, td { padding: 13px 14px; text-align: left; border-bottom: 1px solid #edf0f4; } th { background: #fafbfc; color: #667085; font-size: 13px; }
        .empty, .muted { color: #667085; } .empty { text-align: center; padding: 32px; } a.action { color: #175cd3; font-weight: 600; text-decoration: none; }
        @media(max-width:640px) { nav { gap: 12px; overflow: auto; white-space: nowrap; } }
    </style>
</head>
<body><nav><a href="/portfolio.html" class="active">Портфель</a><a href="/markets.html">Рынок</a><a href="/accounts.html">Счета</a><a href="/orders.html">Заявки</a><a href="/transactions.html">Исполнения</a></nav>
<main><h1>Портфель</h1><p class="muted">Свободное количество = всего минус резерв по открытым заявкам.</p><div class="card"><table><thead><tr><th>Инструмент</th><th>Всего</th><th>Зарезервировано</th><th>Средняя цена покупки</th><th>Последняя цена</th><th>Оценка результата</th><th></th></tr></thead><tbody id="rows"><tr><td colspan="7" class="empty">Загрузка…</td></tr></tbody></table></div></main>
<script>
    const token = localStorage.getItem('jwt_token'); const rows = document.getElementById('rows');
    const price = value => value == null ? '—' : Number(value).toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 4 });
    async function load() {
        if (!token) { rows.innerHTML = '<tr><td colspan="7" class="empty">Войдите в приложение, чтобы увидеть портфель.</td></tr>'; return; }
        try {
            const response = await fetch('/api/portfolio/list', { headers: { Authorization: 'Bearer ' + token } });
            if (!response.ok) throw new Error('HTTP ' + response.status);
            const list = await response.json(); rows.replaceChildren();
            if (!list.length) { rows.innerHTML = '<tr><td colspan="7" class="empty">Портфель пуст. Откройте инструмент и создайте покупку.</td></tr>'; return; }
            list.forEach(position => {
                const tr = document.createElement('tr');
                [position.ticker, position.totalQuantity, position.reservedQuantity || 0, price(position.avgBuyPrice), price(position.currentPrice), price(position.unrealizedProfit)]
                    .forEach(value => { const td = document.createElement('td'); td.textContent = value == null ? '—' : value; tr.appendChild(td); });
                const action = document.createElement('td'); const link = document.createElement('a'); link.className = 'action'; link.href = '/security.html?id=' + encodeURIComponent(position.securityId) + '&side=SELL'; link.textContent = 'Создать продажу';
                action.appendChild(link); tr.appendChild(action); rows.appendChild(tr);
            });
        } catch (error) { rows.innerHTML = '<tr><td colspan="7" class="empty">Не удалось загрузить портфель: ' + error.message + '</td></tr>'; }
    }
    load(); setInterval(load, 30000);
</script></body></html>
