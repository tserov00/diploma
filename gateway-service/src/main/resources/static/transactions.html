<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Исполнения · Demo Broker</title>

    <link rel="stylesheet" href="/app.css">
</head>
<body><nav><a href="/portfolio.html" class="brand" aria-label="Demo Broker — портфель"><span class="brand-mark">D</span><span class="brand-name">Demo Broker</span></a><a href="/portfolio.html">Портфель</a><a href="/markets.html">Рынок</a><a href="/accounts.html">Счета</a><a href="/orders.html">Заявки</a><a href="/transactions.html" class="active">Исполнения</a></nav>
<main class="transactions-page"><h1>История исполнений</h1><p class="muted">Для каждого исполнения сохраняются цена и время снимка котировки, использованного в симуляции.</p>
<div class="card"><table class="transactions-table"><thead><tr><th>ID</th><th>Инструмент</th><th>Сторона</th><th>Тип заявки</th><th>Цена исполнения</th><th>Комиссия</th><th>Количество</th><th>Источник котировки</th><th>Время данных</th><th>Время исполнения</th></tr></thead><tbody id="rows"><tr><td colspan="10" class="empty">Загрузка…</td></tr></tbody></table></div></main>
<script>
    const token = localStorage.getItem('jwt_token'); const rows = document.getElementById('rows');
    const label = value => ({ BUY: 'Покупка', SELL: 'Продажа', MARKET: 'Рыночная', LIMIT: 'Лимитная' }[value] || value || '—');
    const price = value => value == null ? '—' : Number(value).toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 4 });
    const time = value => value ? new Date(value).toLocaleString('ru-RU') : '—';
    function instrumentCell(ticker, companyName) {
        const td = document.createElement('td'); const content = document.createElement('div'); content.className = 'instrument-cell';
        const symbol = document.createElement('span'); symbol.className = 'ticker'; symbol.textContent = ticker || '—'; content.appendChild(symbol);
        if (companyName) { const name = document.createElement('span'); name.className = 'instrument-company'; name.textContent = companyName; content.appendChild(name); }
        td.appendChild(content); return td;
    }
    async function load() {
        if (!token) { rows.innerHTML = '<tr><td colspan="10" class="empty">Войдите в приложение, чтобы увидеть исполнения.</td></tr>'; return; }
        try {
            const response = await fetch('/api/transactions/history', { headers: { Authorization: 'Bearer ' + token } });
            if (!response.ok) throw new Error('HTTP ' + response.status);
            const list = await response.json(); rows.replaceChildren();
            if (!list.length) { rows.innerHTML = '<tr><td colspan="10" class="empty">Исполнений пока нет.</td></tr>'; return; }
            list.forEach(tx => {
                const tr = document.createElement('tr');
                [tx.id].forEach(value => { const td = document.createElement('td'); td.textContent = value == null ? '—' : value; tr.appendChild(td); });
                tr.appendChild(instrumentCell(tx.ticker, tx.companyName));
                [label(tx.side), label(tx.orderType), price(tx.executedPrice), price(tx.executedFee), tx.quantity, tx.dataSource, time(tx.marketDataAt), time(tx.executedAt)]
                    .forEach(value => { const td = document.createElement('td'); td.textContent = value == null ? '—' : value; tr.appendChild(td); });
                rows.appendChild(tr);
            });
        } catch (error) { rows.innerHTML = '<tr><td colspan="10" class="empty">Не удалось загрузить исполнения: ' + error.message + '</td></tr>'; }
    }
    load(); setInterval(load, 15000);
</script></body></html>
