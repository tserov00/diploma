<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Исполнения · Demo Broker</title>
    <style>
        :root { font-family: system-ui, Arial, sans-serif; background: #f3f5f8; color: #172033; } body { margin: 0; }
        nav { display: flex; gap: 22px; padding: 16px max(20px, calc((100% - 1120px) / 2)); background: #fff; border-bottom: 1px solid #e1e5eb; }
        nav a { color: #526176; text-decoration: none; } nav a.active { color: #175cd3; font-weight: 700; }
        main { max-width: 1120px; margin: 32px auto; padding: 0 18px; } .card { background: white; border: 1px solid #e1e5eb; border-radius: 12px; overflow: auto; }
        table { width: 100%; min-width: 900px; border-collapse: collapse; } th, td { padding: 12px; text-align: left; border-bottom: 1px solid #edf0f4; } th { background: #fafbfc; color: #667085; font-size: 13px; }
        .muted, .empty { color: #667085; } .empty { text-align: center; padding: 32px; }
        @media(max-width:640px) { nav { gap: 12px; overflow: auto; white-space: nowrap; } }
    </style>
</head>
<body><nav><a href="/portfolio.html">Портфель</a><a href="/markets.html">Рынок</a><a href="/accounts.html">Счета</a><a href="/orders.html">Заявки</a><a href="/transactions.html" class="active">Исполнения</a></nav>
<main><h1>История исполнений</h1><p class="muted">Для каждого исполнения сохраняются цена и время снимка котировки, использованного в симуляции.</p>
<div class="card"><table><thead><tr><th>ID</th><th>Инструмент</th><th>Сторона</th><th>Тип заявки</th><th>Цена исполнения</th><th>Комиссия</th><th>Количество</th><th>Источник котировки</th><th>Время данных</th><th>Время исполнения</th></tr></thead><tbody id="rows"><tr><td colspan="10" class="empty">Загрузка…</td></tr></tbody></table></div></main>
<script>
    const token = localStorage.getItem('jwt_token'); const rows = document.getElementById('rows');
    const label = value => ({ BUY: 'Покупка', SELL: 'Продажа', MARKET: 'Рыночная', LIMIT: 'Лимитная' }[value] || value || '—');
    const price = value => value == null ? '—' : Number(value).toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 4 });
    const time = value => value ? new Date(value).toLocaleString('ru-RU') : '—';
    async function load() {
        if (!token) { rows.innerHTML = '<tr><td colspan="10" class="empty">Войдите в приложение, чтобы увидеть исполнения.</td></tr>'; return; }
        try {
            const response = await fetch('/api/transactions/history', { headers: { Authorization: 'Bearer ' + token } });
            if (!response.ok) throw new Error('HTTP ' + response.status);
            const list = await response.json(); rows.replaceChildren();
            if (!list.length) { rows.innerHTML = '<tr><td colspan="10" class="empty">Исполнений пока нет.</td></tr>'; return; }
            list.forEach(tx => {
                const tr = document.createElement('tr');
                [tx.id, tx.ticker, label(tx.side), label(tx.orderType), price(tx.executedPrice), price(tx.executedFee), tx.quantity, tx.dataSource, time(tx.marketDataAt), time(tx.executedAt)]
                    .forEach(value => { const td = document.createElement('td'); td.textContent = value == null ? '—' : value; tr.appendChild(td); });
                rows.appendChild(tr);
            });
        } catch (error) { rows.innerHTML = '<tr><td colspan="10" class="empty">Не удалось загрузить исполнения: ' + error.message + '</td></tr>'; }
    }
    load(); setInterval(load, 15000);
</script></body></html>
