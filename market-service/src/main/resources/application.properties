spring.application.name=market-service
server.port=7073
spring.datasource.url=jdbc:postgresql://localhost:5432/broker_market
spring.datasource.username=postgres
spring.datasource.password=mypassword
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.show-sql=true
logging.level.org.hibernate=INFO
logging.level.org.springframework.jdbc=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
market.data.provider=${MARKET_DATA_PROVIDER:ALOR}
market.data.alor.base-url=${ALOR_BASE_URL:https://api.alor.ru}
market.data.refresh-interval-ms=${MARKET_DATA_REFRESH_INTERVAL_MS:60000}
